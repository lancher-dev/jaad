name: Publish to npm

# `v*` releases jaad, `create-v*` releases the scaffolder
on:
  push:
    tags:
      - "v*"
      - "create-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - jaad
          - create-jaad

concurrency:
  group: publish-${{ inputs.package || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: pnpm/setup@v3
        with:
          version: 12
          cache: true

      # npm publishes what package.json says, not what the tag says.
      - name: Resolve the package and check the tag against its version
        id: target
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$PACKAGE" in
              jaad)        dir=packages/jaad ;;
              create-jaad) dir=packages/create-jaad ;;
              *) echo "unrecognised package $PACKAGE" >&2; exit 1 ;;
            esac
          else
            case "$GITHUB_REF_NAME" in
              create-v*) dir=packages/create-jaad; tag="${GITHUB_REF_NAME#create-v}" ;;
              v*)        dir=packages/jaad;        tag="${GITHUB_REF_NAME#v}" ;;
              *) echo "unrecognised tag $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi

          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match $name@$version" >&2
            exit 1
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm, nothing to do"
          else
            echo "releasing $name@$version"
          fi

      - name: Type check
        if: steps.target.outputs.published != 'true'
        run: pnpm check

      - name: Unit tests
        if: steps.target.outputs.published != 'true'
        run: pnpm test

      - name: Build the site
        if: steps.target.outputs.published != 'true'
        run: pnpm build

      - name: Assertions on the built site
        if: steps.target.outputs.published != 'true'
        run: pnpm test:build

      # The tarball is what gets published, so it is what has to be proven.
      - name: Consumer install
        if: steps.target.outputs.published != 'true'
        run: pnpm test:consumer

      - name: Publish
        if: steps.target.outputs.published != 'true'
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --provenance --access public
