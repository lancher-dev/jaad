name: Publish to npm

# `v*` releases jaad, `create-v*` releases the scaffolder
on:
  push:
    tags:
      - "v*"
      - "create-v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: pnpm/setup@v3
        with:
          version: 12
          cache: true

      # npm publishes what package.json says, not what the tag says.
      - name: Resolve the package and check the tag against its version
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            create-v*) dir=packages/create-jaad; tag="${GITHUB_REF_NAME#create-v}" ;;
            v*)        dir=packages/jaad;        tag="${GITHUB_REF_NAME#v}" ;;
            *) echo "unrecognised tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

          name="$(node -p "require('./$dir/package.json').name")"
          version="$(node -p "require('./$dir/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match $name@$version" >&2
            exit 1
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "releasing $name@$version"

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build the site
        run: pnpm build

      - name: Assertions on the built site
        run: pnpm test:build

      # The tarball is what gets published, so it is what has to be proven.
      - name: Consumer install
        run: pnpm test:consumer

      - name: Publish
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --provenance --access public
